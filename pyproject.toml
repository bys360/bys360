[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "app/static/*",
  "app/templates/*",
  "app/inspect_*",
  "app/*snippet*",
]
# BYS360 Campaign 1B (2026-07-24): the previous fail_under = 80 was fictional --
# no CI step ever ran pytest with --cov=, so this threshold was never actually
# enforced against a real measurement. Re-measured for real, over CI's true
# test scope (tests/quality -m ci_safe, then tests/integration
# tests/architecture tests/security tests/critical; branch=true), combined
# line+branch coverage = 18.85% (recorded at the time in
# reports/quality/coverage_baseline.json -- since re-baselined, see its _history --
# lines 23480/102307, branches 1355/29448). fail_under is set to 18 here --
# an integer floor conservatively below the measured 18.85%, so a bare
# `pytest --cov=app` / `coverage report` run (which has no access to the
# ratchet script's own 0.5-point tolerance) does not spuriously fail on
# ordinary float/platform noise.
#
# This is an enforced FLOOR, not an aspirational number. The real CI gate
# that must not regress below the current measured baseline is
# scripts/quality/bys360_coverage_ratchet.py, which compares
# reports/quality/coverage.xml against reports/quality/coverage_baseline.json
# with documented tolerance -- see that script's docstring. Raising this
# fail_under value (or the ratchet baseline) is a separate, human-reviewed
# action once real coverage has genuinely and durably improved -- never done
# automatically by any script here.
#
# 80% MAY be documented as a long-term aspirational target for this project,
# but must never be presented as verified coverage.
#
# Status note (2026-09-24, comment-only; no coverage config changed):
# - 18.85% above is the HISTORICAL Campaign 1B measurement (2026-07-24), not a
#   current figure. fail_under = 18 is retained as that historical low floor.
# - The authoritative regression gate is scripts/quality/bys360_coverage_ratchet.py
#   + reports/quality/coverage_baseline.json. The baseline file is a stored
#   regression floor, not a current-measurement indicator; it is never raised
#   automatically -- only via a separate, human-reviewed re-baseline.
# - Latest verified production CI measurement (dated snapshot, not a target or
#   guaranteed minimum): combined coverage 42.1228% -- GitHub Actions run
#   35823128265, SHA 1ea5c5dcf6161104dc8adb04a982cba0eba8e8e6, 2026-09-23.
fail_under = 18
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "(migrations|node_modules|dist|build)"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# scripts/archive/ holds frozen historical snapshots (pre_handover_20260708/)
# and one-off refactor-campaign tooling (phase2y-wave1/2) that were never
# live and are not imported by any active code path; the one exception
# (bys360_score100_quality_gate_v1.py) was canonicalized to its active
# scripts/quality/ location on 2026-07-27 and no longer depends on the
# archive at runtime. See tests/architecture/test_score100_active_canonical_source_contract.py.
exclude = "(^migrations/|^app/static/|^app/templates/|^scripts/archive/)"
# tests/ has no __init__.py anywhere (by design of this repo's test layout),
# so several identically-named conftest.py files (tests/conftest.py,
# tests/critical/conftest.py, tests/architecture/conftest.py, ...) collide
# on the same top-level module name "conftest" under mypy's classic
# module-name resolution, crashing the CI invocation with
# "Duplicate module named conftest" (exit code 2) before any type checking
# runs. explicit_package_bases (+ mypy_path pointing at the repo root)
# makes mypy derive each file's dotted module name from its path relative
# to the repo root instead (e.g. tests.conftest vs
# tests.critical.conftest), which resolves the collision without adding
# __init__.py files anywhere. Config-only change; no test files touched.
explicit_package_bases = true
mypy_path = "."

# db.Model is a Flask-SQLAlchemy runtime attribute mypy cannot statically
# resolve as a base class; every ORM model module hits this the same way.
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.modules.strategic_performance.models",
    "app.services.performance.models_phase5_template",
]
disable_error_code = ["name-defined"]

# Dynamic property monkeypatching on an ORM class after definition
# (wrapped in try/except NameError) confuses mypy's method/assignment
# checks; contained to this one file.
[[tool.mypy.overrides]]
module = "app.models.performance_low_score_models"
disable_error_code = ["method-assign", "assignment"]

# Deliberate temporary monkeypatch of Flask's bound app.add_url_rule method
# to catch-and-skip a specific duplicate-endpoint AssertionError during
# blueprint registration, restored via try/finally right after. Ruff's B010
# rejects the setattr() alternative, so the direct assignment (the actual
# established pattern) is kept and only this narrow error class silenced.
[[tool.mypy.overrides]]
module = "app.bootstrap.route_bootstrap"
disable_error_code = ["method-assign", "assignment"]

# Process-wide monkeypatch of requests.sessions.Session.request to install a
# default outbound HTTP timeout guard; same Ruff B010 vs direct-assignment
# tradeoff as app.bootstrap.route_bootstrap above.
[[tool.mypy.overrides]]
module = "app.runtime.http_timeout_guard"
disable_error_code = ["method-assign"]

# db.relationship(..., lazy="dynamic") returns an AppenderQuery at runtime
# but mypy sees the plain RelationshipProperty descriptor (no stubs model
# the lazy="dynamic" instance-access behavior), so .filter()/.order_by()/
# .first()/.all() on these attributes misreport as "not callable". Verified
# every remaining finding in this file is this exact pattern before adding.
[[tool.mypy.overrides]]
module = "app.services.communication_phase2_service"
disable_error_code = ["misc", "operator"]

# These modules receive their names via `globals().update(route_globals)`
# from the parent route module at registration time (see app/api/mobile/*
# read-route bridges) - a pattern already accepted for ruff's F821 in
# app/menu_registry.py and friends.
[[tool.mypy.overrides]]
module = [
    "app.api.mobile.performance_read_routes",
    "app.api.mobile.light_read_routes",
    "app.api.mobile.communication_read_routes",
    "app.api.mobile.detail_read_routes",
    "app.api.mobile.support_survey_read_routes",
    "app.api.mobile.communication_v2_read_routes",
    "app.api.mobile.utility_routes",
]
disable_error_code = ["name-defined"]

# Dynamic menu/live-scope globals populated via globals().get(...)/globals()
# injection elsewhere in the module - the same pattern already annotated
# with `# noqa: F821 - dynamic menu registry global` for ruff. The same
# module-level names get reassigned via globals().get(...) at many
# independent points across these files (one per historical "Faz" split),
# which defeats mypy's redefinition tracking for the accumulator variables
# built from them (assignment/attr-defined/index/call-overload), not just
# the name lookup itself.
[[tool.mypy.overrides]]
module = [
    "app.live_scope",
    "app.menu_registry",
    "app.menu_registry_data_sections",
    "app.menu_registry_data_performance",
]
disable_error_code = ["name-defined", "assignment", "attr-defined", "index", "call-overload"]

# Same reused-throwaway-variable-name-across-independent-blocks pattern as
# menu_registry.py (each historical "V-something" role matrix patch block
# reuses `_rows`/`_group` at module scope with a different inferred
# list/tuple shape). Every remaining finding here was individually verified
# to be this pattern before disabling.
[[tool.mypy.overrides]]
module = "app.services.role_matrix_ui_service"
disable_error_code = ["assignment", "operator", "arg-type", "attr-defined"]

# Every remaining finding in this file is joinedload(Model.relationship)
# against the same unstubbed lazy="dynamic" relationship descriptor as
# elsewhere; verified individually (no other arg-type finding exists here).
[[tool.mypy.overrides]]
module = "app.services.leave_delegation_service"
disable_error_code = ["arg-type"]

# self.status_history is a plain db.relationship (no lazy="dynamic") accessed
# from within the model's own @property methods, where it is the actual
# instance-level related-object list at runtime; the stub only models the
# class-level RelationshipProperty descriptor, so indexing/iterating it here
# misreports as not indexable/not iterable. Both findings in this file
# verified to be this exact pattern.
[[tool.mypy.overrides]]
module = "app.models.support_models"
disable_error_code = ["index", "attr-defined"]

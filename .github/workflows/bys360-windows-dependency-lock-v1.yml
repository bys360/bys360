name: BYS360 Windows Dependency Lock V1

# requirements.lock is the production install set (Windows x64, CPython 3.12). This job proves it
# on a real Windows runner: the lock regenerates byte-identically, both manifests pass pip-audit
# with no exceptions, a clean venv installs it hash-checked, the wheelhouse verifies every wheel's
# SHA256 and installs offline, and both installs pass the dependency smoke test.

on:
  push:
    branches: [ assistant-v2-full ]
  pull_request:
    branches: [ assistant-v2-full ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dependency-lock:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin the resolver and the audit tool
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pip==26.2.2
          python -m pip install pip-audit==2.10.1
          python -c "import platform, sys; print(sys.version); print(platform.machine())"

      - name: requirements.lock regenerates byte-identically on Windows x64 CPython 3.12
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/release/generate_bys360_requirements_lock.py --check

      - name: Dependency audit -- requirements.lock (every pinned package)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip_audit -r requirements.lock --disable-pip --progress-spinner off

      - name: Dependency audit -- requirements.txt (as resolved on Windows)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Hash-checked install into a clean venv, then smoke test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $venv = Join-Path $env:RUNNER_TEMP "lock-online"
          python -m venv $venv
          $py = Join-Path $venv "Scripts\python.exe"
          & $py -m pip install pip==26.2.2
          & $py -m pip install --require-hashes --no-deps -r requirements.lock
          & $py -m pip check
          & $py scripts/release/smoke_bys360_dependency_stack.py --root .

      - name: Wheelhouse build with SHA256 verification
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheelhouse = Join-Path $env:RUNNER_TEMP "wheelhouse"
          python scripts/release/build_bys360_wheelhouse.py --clean --output $wheelhouse --report reports/quality/windows_dependency_lock/BYS360_WHEELHOUSE_BUILD_REPORT.json

      - name: Offline install from the wheelhouse into a clean venv, then smoke test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheelhouse = Join-Path $env:RUNNER_TEMP "wheelhouse"
          $venv = Join-Path $env:RUNNER_TEMP "lock-offline"
          python -m venv $venv
          $py = Join-Path $venv "Scripts\python.exe"
          & $py -m pip install --no-index --find-links $wheelhouse --require-hashes --no-deps -r requirements.lock
          & $py -m pip check
          & $py scripts/release/smoke_bys360_dependency_stack.py --root .

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bys360-windows-dependency-lock-v1
          path: reports/quality/windows_dependency_lock/
          if-no-files-found: ignore

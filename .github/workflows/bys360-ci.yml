name: Run tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop, assistant-v2-full ]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # TD-032 remote-CI unblock (2026-08-17): the prior 25-minute budget was
    # proven insufficient by a real remote run cancelled at ~25m18s with
    # "Run integration and architecture tests" (Step2) at 99% -- 0 test
    # failures, 0 errors, no concurrency/superseding-push mechanism
    # configured in this workflow, and the timing matched timeout-minutes:
    # 25 almost exactly. The budget was then raised to 45 minutes.
    #
    # Second remote-CI unblock (2026-09-15): 45 minutes was itself proven
    # insufficient by the same failure mode recurring -- a real remote run
    # cancelled by its own timeout-minutes: 45 mid-Step2 (0 test failures,
    # 0 errors; see tests/architecture/test_postgres_migration_ci_enforcement_contract.py's
    # test_quality_gate_job_timeout_has_an_evidence_backed_floor for the
    # regression guard). An isolated GitHub Ubuntu diagnostic run of the
    # exact canonical Step1+Step2 selection at this branch's SHA measured
    # Step1 2m48s and Step2 alone 1h04m50s (total job 1h08m50s), after two
    # Linux-only test-fixture portability defects (hardcoded Windows temp
    # and repository-worktree paths) were fixed -- the Step2 runtime itself,
    # not a defect, was the bottleneck. 90 minutes leaves a real margin
    # (~20 min) over that measured total without being an unbounded budget.
    timeout-minutes: 180

    # TD-032 closure: real PostgreSQL 15 target for the migration-integrity
    # gate below. Disposable, CI-only credentials -- never production
    # secrets. Additive: nothing above/below this depends on it, and no
    # existing step's command or semantics changed.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bys360_ci_test_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # TD-032 remote-CI unblock (2026-08-16): actions/checkout@v4's default
      # fetch-depth (1) produces a shallow clone with only the tip commit's
      # object present. Several historical-wave contract tests (e.g.
      # tests/quality/test_openapi_workflow_drift_cleanup_contract.py) run
      # `git show <fixed-historical-sha>:<path>` to prove what a past commit
      # actually contained -- a real, currently-reproduced shallow-clone
      # error ("fatal: path ... does not exist in '<sha>'") because that
      # commit object is absent from a depth-1 checkout, even though the
      # path exists in the current working tree. fetch-depth: 0 fetches full
      # history so every such fixed-ref lookup resolves identically to a
      # local full clone. This is the only change to this step.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: BYS360 secret/repo gate
        run: python scripts/quality/bys360_secret_repo_gate.py --root .

      - name: Build safe release audit
        run: python scripts/release/build_bys360_safe_release.py --root . --output /tmp/bys360-ci-safe-release.zip --audit-only

      # NOT (BYS360 Truthful Quality Gates, Campaign 1, 2026-07-24): bu adım isminden
      # farklı olarak yalnızca F821'i değil, pyproject.toml [tool.ruff.lint] select
      # listesinin tamamını (E,F,I,UP,B,SIM) uygular. Ad, gerçek kapsamı yansıtacak
      # şekilde düzeltildi; komut/kapsam DEĞİŞTİRİLMEDİ. Bu adım şu an gerçekten
      # kırmızıdır (41 bulgu) — bkz. reports/quality/BYS360_RUFF_GATE_DEBT_INVENTORY_FOR_CAMPAIGN2.md
      # ve branch phase5-ruff-tests-cleanup-v1.
      - name: Ruff full-select gate (E,F,I,UP,B,SIM)
        run: python -m ruff check app config.py wsgi.py run.py scripts tests

      - name: Compile Python source
        run: python -m compileall -q app config.py wsgi.py run.py scripts

      - name: BYS360 safe release audit
        run: |
          mkdir -p reports/quality
          python scripts/release/build_bys360_safe_release.py --root . --output reports/quality/BYS360_SAFE_RELEASE_CI_AUDIT.zip --audit-only

      - name: Run quality tests
        run: python -m pytest tests/quality -m "ci_safe" --cov=app --cov-report= --cov-fail-under=0 --tb=short -q

      # NOT (BYS360 Phase 6, CI Coverage Scope Policy Closure, 2026-07-27): tests/services
      # (422 tests) was identified back in Campaign 1 as the lowest-risk, highest-priority
      # candidate for CI coverage inclusion ("izole ve birlikte %100 geçiyor") but the
      # planned follow-up to actually add it was never done. Re-verified here: 0 skip/xfail/
      # realdb/slow/live markers anywhere in tests/services, no dedicated conftest.py, 3
      # stability runs (isolated x2 + mixed into the full suite) all 422 passed/0 failed,
      # and it adds only ~12% to this step's runtime for a +3.2 percentage point combined
      # coverage gain. Root cause of the prior exclusion was a stalled rollout plan, not a
      # technical blocker -- see reports/quality/coverage_baseline.json for the full
      # re-measurement this addition is based on.
      #
      # NOT (BYS360 Phase 6, Critical Operational CI Coverage Expansion, 2026-07-27):
      # tests/migrations and tests/release are stable, isolated and required for
      # schema/deployment coverage: 0 cross-scope duplicate node IDs against the
      # rest of this workflow or each other, 0 skip/xfail, no local conftest.py,
      # each folder passed twice in isolation and once combined. tests/migrations
      # runs real Alembic upgrade()/downgrade() against an isolated in-memory
      # SQLite engine (no network, no persistent state).
      #
      # NOT (BYS360 CI Coverage Gate Drift Closure): tests/workflow (originally
      # added to this scope by the note above, when it still existed) was deleted
      # in commit 5401195 ("remove orphan presentation subsystem") along with the
      # dead app/workflow/ package it tested -- ORPHAN_CONFIRMED, see that
      # commit's message for the full evidence trail. Leaving the now-nonexistent
      # tests/workflow path in this command made pytest exit 4 ("file or
      # directory not found") on its ENTIRE positional-argument list -- not just
      # skipping 7 tests, but silently zeroing out this whole step's ~3400+ tests
      # and its coverage.xml output, which in turn made every step after this one
      # (coverage ratchet, mypy, ops audit, Quality9, pip-audit) unreachable in
      # real CI. tests/workflow's replacement, the canonical cleanup contract
      # tests/quality/test_workflow_orphan_presentation_subsystem_cleanup_contract.py
      # (82 tests: deleted-file absence, historical git-ref reproducibility,
      # url_map invariance, migration byte-identity, route_registry manifest
      # accuracy), is listed explicitly below -- it lives in tests/quality/ but
      # carries no ci_safe marker, so the "Run quality tests" step's -m "ci_safe"
      # filter does not select it; it must be named here to actually execute.
      #
      # NOT (BYS360 Phase 6, Communication/Behavior/Mobile CI Coverage Expansion,
      # 2026-07-27): tests/communication and tests/mobile are 0-import AST/source-contract
      # checks (no app.* import at all, so they add ~0% measurable app/ coverage, but are
      # kept as required structural gates for route registration and facade-size
      # invariants); tests/behavior imports real app.services/app.models and does
      # contribute measurable app/ coverage. All three: 0 cross-scope duplicate node IDs,
      # 0 skip/xfail, stable across 2 isolated runs + 1 combined run (29/29, 0 failed);
      # adds only ~2% to this step's runtime.
      #
      # NOT (BYS360 Phase 7, Quality/Top-Level CI Coverage Expansion, 2026-07-27):
      # 32 of the 33 loose tests/test_*.py files (536 of 536 minus the 3 tests in
      # tests/test_live_scope_and_security_static.py, which carries a module-level
      # pytest.mark.live/realdb/slow despite its bodies being plain static file
      # checks -- left out deliberately, needs a separate human decision on
      # whether that marker is stale, not swept in here) were never part of any
      # CI-enforced run at all. Re-verified here: 0 skip/xfail, 0 cross-scope
      # duplicate node IDs against the rest of this workflow or each other, stable
      # across 2 isolated runs + 1 full-suite-mixed run + post-full-suite isolated
      # re-run (533/533, 0 failed every time), no subprocess/network/real-DB/Redis
      # usage anywhere in the set. Listed explicitly (not a glob) so collection is
      # unambiguous across shells. tests/test_claude_phase5_template_compilation.py
      # (454 of the 533) is a 0-import Jinja2 syntax-parse contract test, kept as
      # a required structural gate like tests/communication/tests/mobile even
      # though it contributes ~0% measurable app/ coverage on its own; the
      # remaining tests import real app.services/app.models/app factory code and
      # do contribute measurable app/ coverage. Adds ~14s to this step's runtime
      # (395-403s measured vs 409s baseline across repeated runs -- within normal
      # run-to-run variance, not a real regression). tests/load and tests/performance
      # are explicitly out of scope for this addition -- see
      # reports/quality/coverage_baseline.json for the full re-measurement.
      #
      # NOT (BYS360 Phase 8, Top-Level Test Hygiene Closure, 2026-07-27):
      # tests/test_live_scope_and_security_static.py was withheld in Phase 7
      # pending review of its pytest.mark.live/realdb/slow markers. Re-
      # verified: all 3 tests are plain Path.read_text() + string-presence
      # checks (0 app.* import, 0 DB/network/subprocess); the markers predate
      # this repo's earliest visible commit with no recorded rationale and
      # match an identical mistagging pattern on another purely static file
      # (tests/architecture/test_survey_live_contract.py, out of this wave's
      # scope) -- consistent with naming-convention-driven mistagging, not an
      # actual runtime requirement. Markers removed from the file; 2 isolated
      # runs + full-suite-mixed + post-full-suite isolated re-run all 3/3, 0
      # failed, identical whether or not the marker filter is applied.
      - name: Run integration and architecture tests
        run: python -m pytest tests/integration tests/architecture tests/security tests/critical tests/services tests/migrations tests/release tests/communication tests/behavior tests/mobile tests/performance tests/quality/test_workflow_orphan_presentation_subsystem_cleanup_contract.py tests/test_10_10_core_static_gate.py tests/test_ai_analysis_excel_preview_static.py tests/test_ai_executive_report_static.py tests/test_ai_recommendation_priority_static.py tests/test_ai_routes.py tests/test_claude_phase5_function_signatures.py tests/test_claude_phase5_template_compilation.py tests/test_compat_redirects.py tests/test_datetime_utils.py tests/test_error_support.py tests/test_feedback_admin_endpoint_static.py tests/test_feedback_privacy_static.py tests/test_feedback_pulse_admin_tab_static.py tests/test_feedback_pulse_menu_visibility_static.py tests/test_feedback_pulse_privacy_behavior.py tests/test_hr_reports_template_no_unpack_static.py tests/test_live_scope_and_security_static.py tests/test_module_maturity_scoring.py tests/test_no_admin_org_units_duplicate_static.py tests/test_no_duplicate_admin_org_units_static.py tests/test_performance_archive_visibility_contract.py tests/test_performance_chain_constitution.py tests/test_performance_form_guard.py tests/test_performance_ops_center.py tests/test_performance_preflight.py tests/test_performance_publish_guard.py tests/test_performance_publish_preflight_static.py tests/test_performance_publish_preflight_rules_behavior.py tests/test_personel_analizi_dalga7_static.py tests/test_score100_handover_docs_contract_v1.py tests/test_shared_cache_store_behavior.py tests/test_sp_routes_smoke.py tests/test_team_compare_publish_visibility.py tests/test_team_compare_service.py --cov=app --cov-append --cov-report=term-missing --cov-report=xml:reports/quality/coverage.xml --cov-fail-under=0 --tb=short -q

      # TD-032 closure (2026-08-16): the `postgres:15` service above is a
      # fresh container per job run, so `postgres` (its own maintenance DB)
      # is always empty of app tables -- CREATE DATABASE here only adds the
      # one disposable target database the gate below is allowed to touch,
      # matching this gate's own naming contract
      # (bys360_postgres_migration_integrity_gate.py's SAFE_DB_NAME_RE).
      #
      # TD-032 remote-CI unblock (2026-08-17): this job has no job-level
      # `container:`, so it runs directly on the ubuntu-latest HOST runner,
      # not inside a Docker container alongside the `postgres` service. Per
      # GitHub's own documented service-container networking model, the
      # service's Docker-network hostname ("postgres", the service label)
      # is only resolvable from *other containers on that same job's
      # network -- a host-runner process has no such DNS entry, only the
      # published host port (`ports: 5432:5432` above already publishes it
      # to the runner). Confirmed by the exact reproduced remote error:
      # `psycopg2.OperationalError: could not translate host name "postgres"
      # to address: Temporary failure in name resolution`. Fixed by using
      # 127.0.0.1 (the runner's own loopback, where the published port
      # lands) instead of the service label -- the correct host for a
      # host-runner job with a port-mapped service, not a DNS problem to
      # retry around.
      - name: Create disposable PostgreSQL 15 migration-test database
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect(host='127.0.0.1', port=5432, user='postgres', password='bys360_ci_test_only_password', dbname='postgres')
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute('CREATE DATABASE bys360_migration_test_ci;')
          conn.close()
          "

      # TD-032 closure: same harness used for every local ad-hoc TD-032
      # verification run in this repo's history (see
      # scripts/quality/bys360_postgres_migration_integrity_gate.py) --
      # empty DB -> flask db upgrade -> head match -> second upgrade is a
      # no-op -> critical schema introspection, all against a real
      # PostgreSQL 15 server, not SQLite. Host/db-name/PG-major guards are
      # hardcoded in the gate itself (no bypass flag); this step only
      # supplies a target that satisfies them.
      #
      # TD-032 remote-CI unblock (2026-08-17): host changed from the
      # unreachable "postgres" service-label to 127.0.0.1, matching the
      # create-database step above -- see that step's comment for the full
      # host-runner-vs-container networking explanation. 127.0.0.1 was
      # already in the gate's own ALLOWED_HOSTS (no harness change needed);
      # only the now-unused "postgres" CI-host allowance in
      # ALLOWED_CI_HOSTS is left as-is, unused but harmless.
      - name: PostgreSQL 15 migration integrity gate
        env:
          BYS360_REALDB_MIGRATION_TEST_URL: postgresql://postgres:bys360_ci_test_only_password@127.0.0.1:5432/bys360_migration_test_ci
        run: python scripts/quality/bys360_postgres_migration_integrity_gate.py

      # NOT (BYS360 Truthful Quality Gates, Campaign 1B, 2026-07-24): pyproject.toml
      # [tool.coverage.report] fail_under is enforced by pytest-cov on EVERY
      # invocation, but the ci_safe step alone measures ~0% (it imports almost no
      # app code), which would abort this sequence before the broader step ever
      # runs. --cov-fail-under=0 disables that per-invocation check; this ratchet
      # step is the real, single enforcement point instead.
      - name: Coverage ratchet gate
        run: python scripts/quality/bys360_coverage_ratchet.py --coverage-xml reports/quality/coverage.xml --baseline reports/quality/coverage_baseline.json

      - name: Type check service layer
        run: python -m mypy app tests scripts --ignore-missing-imports --no-error-summary

      - name: BYS360 operations audit
        run: |
          mkdir -p reports/quality
          python scripts/quality/bys360_ops_audit.py --mode ci --source-paths app config.py wsgi.py run.py --report reports/quality/BYS360_OPS_AUDIT_CI.md --max-print 0 --max-broad-except 2300

      - name: BYS360 Quality 9 CI contract gate
        run: python scripts/quality/bys360_quality9_ci_gate.py --root .

      - name: Ruff syntax/import sanity
        run: python -m ruff check app config.py wsgi.py run.py scripts --select E9,F63,F7,F82

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bys360-quality-reports
          path: reports/quality
          if-no-files-found: ignore

name: BYS360 Quality Assurance Gate V1

on:
  push:
    branches: [ assistant-v2-full ]
  workflow_dispatch:
  pull_request:
    branches: [ master, main, assistant-v2-full, docs/ministry-review-readme ]

jobs:
  score100-quality-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          python -m pip install -r requirements-dev.txt

      # The production lock is only proven on Windows; this required gate re-resolves it here so a
      # wrong hash, a missing or an extra package fails the merge check (full install/wheelhouse
      # evidence: bys360-windows-dependency-lock-v1.yml).
      - name: requirements.lock regenerates byte-identically (Windows x64 CPython 3.12)
        shell: pwsh
        run: python scripts/release/generate_bys360_requirements_lock.py --check

      - name: Run BYS360 Quality Assurance Gate V1
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows\repair_bys360_score100_quality_gate_v1.ps1 -ProjectRoot "." -Mode gate -RunPipAudit -RunRuff

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bys360-score100-quality-gate-v1-report
          path: reports/quality/score100_quality_gate_v1/
